name: Build desktop app

# Builds installers for macOS, Linux and Windows on GitHub-hosted runners.
# - Run manually from the Actions tab: installers are attached to the run as artifacts.
# - Push a tag like v0.1.0: additionally creates a draft GitHub release with the installers.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            platform: macos-latest
            # One .dmg that runs natively on both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin
          - name: linux
            platform: ubuntu-22.04
            args: ''
          - name: windows
            platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client3/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client3/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: client3
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client3
          args: ${{ matrix.args }}
          # Only publish a release for tag pushes; manual runs just build.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Time logger ${{ github.ref_name }}
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: time-logger-${{ matrix.name }}
          if-no-files-found: error
          path: |
            client3/src-tauri/target/**/release/bundle/dmg/*.dmg
            client3/src-tauri/target/**/release/bundle/deb/*.deb
            client3/src-tauri/target/**/release/bundle/rpm/*.rpm
            client3/src-tauri/target/**/release/bundle/appimage/*.AppImage
            client3/src-tauri/target/**/release/bundle/msi/*.msi
            client3/src-tauri/target/**/release/bundle/nsis/*.exe
