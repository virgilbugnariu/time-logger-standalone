[package]
name = "time-logger"
version = "0.1.0"
description = "Time logger desktop app"
authors = ["Virgil Bugnariu"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "time_logger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
